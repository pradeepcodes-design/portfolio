{% extends "base.html" %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0 fw-bold">My Profile</h4>
            </div>
            <div class="card-body p-4">
                <table class="table table-borderless mb-4">
                    <tr>
                        <th class="ps-0 text-muted fw-medium">Username:</th>
                        <td class="fw-semibold">{{ request.user.username }}</td>
                    </tr>
                    <tr>
                        <th class="ps-0 text-muted fw-medium">Email:</th>
                        <td>{{ request.user.email|default:"—" }}</td>
                    </tr>
                    <tr>
                        <th class="ps-0 text-muted fw-medium">Joined:</th>
                        <td>{{ request.user.date_joined|date:"F j, Y" }}</td>
                    </tr>
                </table>
                <div class="d-grid gap-2">
                    <a href="{% url 'orders:order_list' %}" class="btn btn-outline-primary">My Orders</a>
                    <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
