{% extends 'students/base.html' %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Register Number</label>
      <input type="text" name="register_number" value="{{ student.register_number|default:'' }}" required>
    </div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" value="{{ student.name|default:'' }}" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ student.email|default:'' }}" required>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" value="{{ student.phone|default:'' }}" required>
    </div>
    <div class="form-group">
      <label>Department</label>
      <input type="text" name="department" value="{{ student.department|default:'' }}" required>
    </div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-add">Save</button>
      <a href="{% url 'student_list' %}" class="btn btn-back">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
