{% extends 'students/base.html' %}
{% block content %}
<div class="card text-center">
  <h1>Delete Student</h1>
  <p style="font-size:18px;margin:20px 0;">Are you sure you want to delete <strong>{{ student.name }}</strong> ({{ student.register_number }})?</p>
  <form method="post" style="display:flex;gap:10px;justify-content:center;">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'student_list' %}" class="btn btn-back">Cancel</a>
  </form>
</div>
{% endblock %}
