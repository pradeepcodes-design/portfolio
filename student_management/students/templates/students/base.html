<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    h1, h2 {
      color: #1e3c72;
      margin-bottom: 20px;
    }
    nav {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      border-radius: 0 0 12px 12px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }
    nav a:hover { background: rgba(255,255,255,0.2); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: #1e3c72; color: #fff; }
    tr:hover { background: #f5f5f5; }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn-add { background: #2ecc71; color: #fff; }
    .btn-add:hover { background: #27ae60; }
    .btn-edit { background: #3498db; color: #fff; }
    .btn-edit:hover { background: #2980b9; }
    .btn-delete { background: #e74c3c; color: #fff; }
    .btn-delete:hover { background: #c0392b; }
    .btn-marks { background: #f39c12; color: #fff; }
    .btn-marks:hover { background: #e67e22; }
    .btn-search { background: #9b59b6; color: #fff; }
    .btn-search:hover { background: #8e44ad; }
    .btn-back { background: #95a5a6; color: #fff; }
    .btn-back:hover { background: #7f8c8d; }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.3s;
    }
    .form-group input:focus {
      border-color: #2a5298;
      outline: none;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-danger { background: #f8d7da; color: #721c24; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .pass { color: #2ecc71; font-weight: 700; }
    .fail { color: #e74c3c; font-weight: 700; }
    .grade-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }
    .grade-A { background: #2ecc71; color: #fff; }
    .grade-B { background: #3498db; color: #fff; }
    .grade-C { background: #f39c12; color: #fff; }
    .grade-F { background: #e74c3c; color: #fff; }
    .text-center { text-align: center; }
    .mt-10 { margin-top: 10px; }
    .mb-10 { margin-bottom: 10px; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'student_list' %}">Home</a>
    <a href="{% url 'student_add' %}">Add Student</a>
    <a href="{% url 'student_search' %}">Search</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
